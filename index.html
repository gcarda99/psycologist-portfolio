                        }

                        "@type": "Question",

                            "@type": "Answer",
                            "text": "Ricevo presso il Meta Studio APS, in Via Carmine Amato 1/24, 84085 Mercato San Severino (SA). Inoltre, collaboro presso SalutePsy, in Via Palmiro Togliatti 21, 84083 Castel San Giorgio (SA), e offro consulenze online."

                        "name": "Come prenotare un appuntamento?",

                            "@type": "Answer",
                            "text": "Puoi chiamare o inviare un messaggio al 3317047398, oppure compilare il modulo presente nella sezione Contatti."
                        }

                    {
                        "@type": "Question",
                        "name": "Qual è la differenza tra psicologo e psicoterapeuta?",
                        "acceptedAnswer": {
                            "@type": "Answer",
                            "text": "Lo psicologo è un professionista laureato in Psicologia, abilitato e iscritto all'Albo, che si occupa di valutazione, prevenzione e supporto psicologico. Lo psicoterapeuta è uno psicologo o un medico che ha completato una specifica scuola di specializzazione in psicoterapia. Sono Psicologa e Psicoterapeuta in formazione ad orientamento sistemico-relazionale."

                        "@type": "Question",
                        "name": "Cosa si intende per approccio sistemico-relazionale?",
                        "acceptedAnswer": {
                            "@type": "Answer",
                            "text": "L'approccio sistemico-relazionale considera la persona all'interno dei propri contesti e delle proprie relazioni, come la famiglia, la coppia, la scuola o il lavoro. Nel mio lavoro utilizzo questo orientamento per osservare il modo in cui le dinamiche relazionali possano influire sul benessere psicologico. Perchè un individuo non è \"solo al mondo\" ma è appartiene ad una rete di relazioni che influscono sulla sua salute mentale."
                        }
