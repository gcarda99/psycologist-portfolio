                        "acceptedAnswer": {
                            "@type": "Answer",
                            "text": "Lo psicologo è un professionista laureato in Psicologia e iscritto all'Albo, che si occupa di valutazione, supporto psicologico e counseling. Lo psicoterapeuta è uno psicologo (o medico) che ha completato una scuola di specializzazione in psicoterapia, abilitandolo a trattare disturbi psicologici più strutturati con approcci terapeutici specifici. La Dott.ssa Albano è psicologa e psicoterapeuta in formazione ad orientamento sistemico-relazionale."
                        }
                    },

                        "@type": "Question",

                        }
                    },

                        "@type": "Question",
                        "name": "Quali sono gli psicologi a Mercato San Severino?",
                        "acceptedAnswer": {
                            "@type": "Answer",
                            "text": "A Mercato San Severino (SA) opera la Dott.ssa Mariaelisabetta Albano, Psicologa iscritta all'Albo degli Psicologi della Campania e Psicoterapeuta in formazione ad orientamento sistemico-relazionale. Offre supporto psicologico per bambini, adolescenti, adulti e coppie, con specializzazione nei disturbi dell'apprendimento (DSA), Parent Training e supporto alla genitorialità. È raggiungibile al +39 331 704 7398 o tramite il sito www.psicologalbano.it."

                        "@type": "Question",

                    },

                        "@type": "Question",
                        "name": "La Dott.ssa Albano si occupa di disturbi dell'apprendimento nei bambini?",

                            "text": "Sì, la Dott.ssa Mariaelisabetta Albano è specializzata nella valutazione e nel supporto dei disturbi specifici dell'apprendimento (DSA), tra cui dislessia, disortografia, disgrafia e discalculia. Lavora con bambini e adolescenti, affiancando anche le famiglie e, quando necessario, collaborando con le scuole."

                            "@type": "Answer",
                            "text": "L'approccio sistemico-relazionale considera la persona all'interno del proprio contesto di relazioni: famiglia, coppia, lavoro, società. Anziché concentrarsi solo sul singolo individuo, questo orientamento esplora come le dinamiche relazionali influenzino il benessere psicologico. È particolarmente efficace nei percorsi di terapia di coppia, familiare e nel supporto alla genitorialità."
